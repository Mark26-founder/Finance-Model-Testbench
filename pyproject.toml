[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-model-testbench"
version = "0.1.0"
description = "A local-first, deterministic testbench for financial models through explicit assertions and controlled scenarios."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Finance-Model-Testbench Contributors" }
]
keywords = ["financial-modeling", "testing", "assertions", "scenarios", "excel", "finance"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "openpyxl>=3.1.0",
    "xlcalculator>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = ["src"]
filterwarnings = [
    # Suppress harmless PytestCollectionWarning for dataclasses named Test* (TestDefinition, TestEvidence, TestbenchReport)
    # These are part of the public API defined in C4/C6 and cannot be renamed.
    "ignore::pytest.PytestCollectionWarning",
]
